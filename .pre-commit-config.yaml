repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
      - id: detect-aws-credentials

  - repo: https://github.com/psf/black
    rev: 23.7.0
    hooks:
      - id: black
        language_version: python3.11
        args: [ --line-length=120, --exclude=src/main/python/ ]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.2
    hooks:
      - id: ruff
        args: [--fix, "--per-file-ignores=__init__.py:F401", "--exclude=src/main/python/"]
        language_version: python3.11
      - id: ruff-format
        args: [--exclude=src/main/python/]
        language_version: python3.11

  - repo: https://github.com/PyCQA/flake8
    rev: 6.0.0
    hooks:
      - id: flake8
        language_version: python3.11
        args: [--max-line-length=120, "--per-file-ignores=__init__.py:F401", "--exclude=src/main/python/"]

  #- repo: https://github.com/pre-commit/mirrors-mypy
  #  rev: v0.971
  #  hooks:
  #    - id: mypy
  #      args: ["--install-types", "--non-interactive"]
  #      additional_dependencies: ["mypy==0.971"]
  #      language_version: python3.11

  - repo: https://github.com/pre-commit/mirrors-isort
    rev: v5.10.1
    hooks:
      - id: isort
        name: isort (python)
        language_version: python3.11
        args: ["--skip", "src/main/python/"]
